```html
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Welcome</title>

    <link rel="stylesheet" href="style.css">

    <style>
        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #667eea, #764ba2);
        }

        .wrapper {
            width: 90%;
            max-width: 450px;
            background: white;
            padding: 45px 35px;
            border-radius: 20px;
            text-align: center;
            box-shadow: 0 15px 40px rgba(0, 0, 0, 0.2);
        }

        .user-icon {
            width: 80px;
            height: 80px;
            margin: 0 auto 20px;
            border-radius: 50%;
            background: #667eea;
            color: white;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 36px;
        }

        h1 {
            margin: 0 0 10px;
            font-size: 32px;
            color: #222;
        }

        .subtitle {
            color: #777;
            margin-bottom: 25px;
        }

        #welcome-message {
            margin: 0 0 30px;
            padding: 18px;
            background: #f5f6ff;
            border-radius: 12px;
            color: #444;
            font-size: 16px;
            line-height: 1.6;
        }

        #logout-btn {
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: 10px;
            background: #667eea;
            color: white;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.3s;
        }

        #logout-btn:hover {
            background: #5568d8;
            transform: translateY(-2px);
        }

        #logout-btn:active {
            transform: translateY(0);
        }
    </style>
</head>

<body>

    <div class="wrapper">

        <div class="user-icon">
            👤
        </div>

        <h1>Welcome!</h1>

        <p class="subtitle">
            You are successfully logged in.
        </p>

        <p id="welcome-message"></p>

        <button id="logout-btn" type="button">
            Logout
        </button>

    </div>


    <script>
        fetch("/api/me")
            .then(res => {
                if (!res.ok) {
                    throw new Error("not logged in");
                }

                return res.json();
            })
            .then(data => {
                document.getElementById("welcome-message").innerText =
                    "Hello, " + data.name + " (" + data.email + ")";
            })
            .catch(() => {
                window.location.href = "login.html";
            });


        document.getElementById("logout-btn").addEventListener("click", () => {

            fetch("/api/logout", {
                method: "POST"
            })
            .then(() => {
                window.location.href = "login.html";
            });

        });
    </script>

</body>
</html>
